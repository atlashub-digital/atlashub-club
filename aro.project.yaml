# Configuração comercial desejada do Club Atlas para o ARO (Atlas Revenue Operations).
# Formato: atlashub-digital/atlashub-finance schemas/project-commerce-manifest.schema.json
# Estado: RASCUNHO — ofertas em `draft`; não sincronizar com o ARO sem homologação do fluxo
# no EspelhoMeu e aprovação comercial do Sérgio (docs/19 e docs/20).
# Elegibilidade (estudante, revisão do responsável) é aplicada pelo backend do Club antes do checkout;
# a oferta padrão não exige condição de estudante.
version: "1"

project:
  slug: atlas-club
  name: Atlas Club
  default_market: BR
  default_currency: BRL

products:
  - code: genesis-01
    name: Genesis Turma 01 (8 semanas, 24 ateliers, início previsto 09/01/2027)
    type: course

offers:
  - code: genesis-01-br
    name: Genesis Turma 01 — valor padrão
    products:
      - genesis-01
    market: BR
    currency: BRL
    amount_minor: 49000
    cadence: once
    payment_methods:
      - PIX
    entitlements:
      - atlas-club:course:genesis-01
    status: draft

  - code: genesis-01-student-br
    name: Genesis Turma 01 — estudante elegível (validação prévia no Club)
    products:
      - genesis-01
    market: BR
    currency: BRL
    amount_minor: 19000
    cadence: once
    payment_methods:
      - PIX
    entitlements:
      - atlas-club:course:genesis-01
    status: draft
    metadata:
      club_requires: student_eligibility_approved

fulfillment:
  - entitlement: atlas-club:course:genesis-01
    type: web_access
    target: /conta
